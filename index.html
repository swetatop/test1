<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>UG Crime MDT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<link rel="stylesheet" href="./css/base.css"/>
<link rel="stylesheet" href="./css/layout.css"/>
<link rel="stylesheet" href="./css/components.css"/>
<link rel="stylesheet" href="./css/modal.css"/>
<link rel="stylesheet" href="./css/responsive.css"/>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="noise"></div>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="sidebar-top">

<div class="brand">

<div class="brand-logo">
<img src="https://i.imgur.com/0VNNTKc.png">
</div>

<div>
<h2>UG MDT</h2>
<p>Crime System</p>
</div>

</div>

</div>

<nav class="sidebar-nav">

<button class="nav-item active" data-category="capt">
<i class="fa-solid fa-camera"></i>
<span>Capture</span>
</button>

<button class="nav-item" data-category="fz">
<i class="fa-solid fa-fire-flame-curved"></i>
<span>Напад на ФЗ</span>
</button>

<button class="nav-item" data-category="postavka">
<i class="fa-solid fa-truck"></i>
<span>Поставки</span>
</button>

<button class="nav-item" data-category="sabotage">
<i class="fa-solid fa-water"></i>
<span>Саботаж</span>
</button>

</nav>

<div class="sidebar-bottom">

<div class="system-box">
<div class="dot"></div>
Realtime Firebase
</div>

</div>

</aside>

<!-- CONTENT -->

<main class="main">

<header class="topbar">

<div>

<h1 id="panelTitle">
Capture
</h1>

<p>
Ukraine GTA V Crime Control System
</p>

</div>

<div class="topbar-actions">

<select id="initiatorFilter" class="select">
<option value="all">Усі ініціатори</option>
<option>The Ballas Gang🟣</option>
<option>The Vagos Gang🟡</option>
<option>The Marabunta Gang🔵</option>
<option>The Families Gang🟢</option>
<option>The Bloods Gang🔴</option>
</select>

<select id="defenderFilter" class="select">
<option value="all">Усі захисники</option>
<option>The Ballas Gang🟣</option>
<option>The Vagos Gang🟡</option>
<option>The Marabunta Gang🔵</option>
<option>The Families Gang🟢</option>
<option>The Bloods Gang🔴</option>
</select>

<button class="create-btn" id="createBtn">
<i class="fa-solid fa-plus"></i>
Створити
</button>

</div>

</header>

<section class="stats-grid">

<div class="stat-card">
<span>ACTIVE</span>
<h3 id="activeCount">0</h3>
</div>

<div class="stat-card">
<span>ENDED</span>
<h3 id="endedCount">0</h3>
</div>

<div class="stat-card">
<span>TOTAL</span>
<h3 id="totalCount">0</h3>
</div>

</section>

<section class="requests" id="requestsContainer"></section>

</main>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-card">

<div class="modal-header">

<h2>Нова заявка</h2>

<button onclick="closeModal()">
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<div class="modal-body" id="modalBody"></div>

</div>

</div>

<script src="./js/firebase.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/render.js"></script>
<script src="./js/modal.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
